        <h1>Зворотний зв'язок</h1>
        
        <form action="https://example.com/submit" method="post">
            <label for="name">Ім'я:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" required><br><br>
        
            <label for="subject">Тема звернення:</label>
            <select id="subject" name="subject" required>
                <option value="">Виберіть тему</option>
                <option value="question">Питання</option>
                <option value="feedback">Зворотний зв'язок</option>
                <option value="complaint">Скарга</option>
            </select>
            <br><br>

            <label for="message">Текст повідомлення:</label><br>
            <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
            <br><br>

            <button type="submit" class="btn">Надіслати</button>
            <button type="reset" class="btn">Очистити форму</button>
        </form>
